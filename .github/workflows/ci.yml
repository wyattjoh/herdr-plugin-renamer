name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build (release)
        run: cargo build --release

  # The on-device helper links Apple FoundationModels (macOS 26 SDK). While the
  # `macos-latest` label is mid-migration to macOS 26, runners land on either a
  # macOS 26 image (FoundationModels present) or an older one (module absent).
  # Rather than fail (or go red-but-ignored via continue-on-error), probe the
  # guided-generation macros themselves: a module-only probe can pass under
  # Command Line Tools even when FoundationModelsMacros is unavailable. Build
  # for real when supported, and skip cleanly otherwise. The source also sticks to widely-available
  # API labels (`sampling:` over the newer `samplingMode:`) so it compiles
  # wherever the SDK is present.
  swift-helper:
    name: swift helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test helper build routing
        run: sh scripts/test-build-foundation-helper.sh
      - name: Build helper (skips if guided-generation macros are absent)
        run: |
          probe=$(mktemp "${TMPDIR:-/tmp}/herdr-foundation-probe.XXXXXX.swift")
          trap 'rm -f "$probe"' EXIT
          cat >"$probe" <<'SWIFT'
          import FoundationModels

          @Generable
          struct HerdrFoundationProbe {
              @Guide(description: "Probe FoundationModels guided-generation macro support")
              var slug: String
          }
          SWIFT
          if swiftc -typecheck "$probe" 2>/dev/null; then
            echo "FoundationModels guided-generation macros available; building helper"
            swift build -c release --package-path naming-helper
          else
            echo "::notice::FoundationModels guided-generation macros unavailable; skipping helper build"
          fi
